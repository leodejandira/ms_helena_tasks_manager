version: '3.8'

services:
  api:
    build: .
    container_name: ms_helena_tasks_manager_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Espelha as alterações de código locais para dentro do container
      - .:/app
    # Executa com --reload para desenvolvimento local
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload